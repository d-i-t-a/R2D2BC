<!DOCTYPE html>
<html lang="en">
<head>
    <title>D2 Reader — Small Window (600×500) with safeArea on all sides</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="reader.css" />
    <script src="reader.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
        }
        h1 { font-size: 14pt; color: #333; }
        .reader-frame {
            width: 600px;
            height: 500px;
            background: #fff;
            border: 1px solid #999;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            display: grid;
            grid-template-columns: 36px 1fr 36px;
            grid-template-rows: 32px 1fr 24px;
            position: relative;
        }
        .toolbar {
            grid-column: 1 / -1;
            grid-row: 1;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: #fafafa;
            border-bottom: 1px solid #e0e0e0;
        }
        .sidebar-left {
            grid-column: 1;
            grid-row: 2;
            background: #f5f5f5;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 7pt;
            color: #888;
            writing-mode: vertical-rl;
        }
        .sidebar-right {
            grid-column: 3;
            grid-row: 2;
            background: #f5f5f5;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 7pt;
            color: #888;
            writing-mode: vertical-rl;
        }
        .statusbar {
            grid-column: 1 / -1;
            grid-row: 3;
            display: flex;
            align-items: center;
            padding: 0 6px;
            background: #fafafa;
            border-top: 1px solid #e0e0e0;
            font-size: 7pt;
            color: #888;
        }
        .pill { height: 24px; padding: 0 8px; font-size: 7pt; text-transform: uppercase; letter-spacing: .5px; border: 1px solid #d0d0d0; border-radius: 12px; background: #fff; color: #555; cursor: pointer; }
        .pill:hover { background: #f5f5f5; }
        .pill.active { background: #e8e8e8; color: #000; }
        .info { font-size: 7pt; color: #888; margin-left: auto; }
        #D2Reader-Container {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        #iframe-wrapper {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: auto;
            overscroll-behavior-x: contain;
        }
        #iframe-wrapper iframe { overscroll-behavior-x: contain; }
        html, body { overscroll-behavior-x: contain; }
    </style>
</head>
<body>
    <h1>Reader inside a 600×500 box (chrome on all 4 sides)</h1>

    <div class="reader-frame">
        <div class="toolbar">
            <button class="pill" onclick="d2reader.previousPage()">&lsaquo; Prev</button>
            <button class="pill" onclick="d2reader.nextPage()">Next &rsaquo;</button>
            <button class="pill" id="btn-scroll" onclick="toggleScroll()">Paginated</button>
            <span class="info" id="page-info"></span>
        </div>
        <div class="sidebar-left">LEFT</div>
        <div id="D2Reader-Container">
            <main tabindex="-1" id="iframe-wrapper">
                <div id="reader-loading" class="dita-loading"></div>
                <div id="reader-error" class="dita-error"></div>
            </main>
        </div>
        <div class="sidebar-right">RIGHT</div>
        <div class="statusbar"><span>STATUS</span></div>
    </div>

    <script>
        let urlParams = Object.fromEntries(new URL(location.href).searchParams);
        let d2reader, isScroll = false;
        let origin = window.location.origin;

        const isLtr = (ctx) => ctx.scriptMode === "ltr";
        const isRtl = (ctx) => ctx.scriptMode === "rtl";
        const isCjkHorizontal = (ctx) => ctx.scriptMode === "cjk-horizontal";
        const isCjkVertical = (ctx) =>
            ctx.scriptMode === "cjk-vertical" || ctx.scriptMode === "mongolian-vertical";

        let injectables = [
            { type: 'style', url: origin + '/viewer/readium-css-v2/ReadiumCSS-before.css', r2before: true, when: isLtr },
            { type: 'style', url: origin + '/viewer/readium-css-v2/ReadiumCSS-default.css', r2default: true, when: isLtr },
            { type: 'style', url: origin + '/viewer/readium-css-v2/ReadiumCSS-after.css', r2after: true, when: isLtr },
            { type: 'style', url: origin + '/viewer/readium-css-v2/rtl/ReadiumCSS-before.css', r2before: true, when: isRtl },
            { type: 'style', url: origin + '/viewer/readium-css-v2/rtl/ReadiumCSS-default.css', r2default: true, when: isRtl },
            { type: 'style', url: origin + '/viewer/readium-css-v2/rtl/ReadiumCSS-after.css', r2after: true, when: isRtl },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-horizontal/ReadiumCSS-before.css', r2before: true, when: isCjkHorizontal },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-horizontal/ReadiumCSS-default.css', r2default: true, when: isCjkHorizontal },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-horizontal/ReadiumCSS-after.css', r2after: true, when: isCjkHorizontal },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-vertical/ReadiumCSS-before.css', r2before: true, when: isCjkVertical },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-vertical/ReadiumCSS-default.css', r2default: true, when: isCjkVertical },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-vertical/ReadiumCSS-after.css', r2after: true, when: isCjkVertical },
            { type: 'style', url: origin + '/viewer/readium-css-v2/ReadiumCSS-dita-patch.css', when: (ctx) => !isCjkVertical(ctx) },
            { type: 'style', url: origin + '/viewer/readium-css-v2/cjk-vertical/ReadiumCSS-dita-patch.css', r2after: true, when: isCjkVertical },
        ];

        // Persist last reading position keyed by manifest URL so each book
        // restores independently on refresh.
        const positionKey = 'd2reader-position:' + urlParams['url'];
        let savedLocator = null;
        try {
            const raw = localStorage.getItem(positionKey);
            if (raw) savedLocator = JSON.parse(raw);
        } catch(_) {}

        D2Reader.load({
            url: new URL(urlParams['url']),
            injectables: injectables,
            injectablesFixed: [],
            lastReadingPosition: savedLocator,
            attributes: {
                scrollContainer: "iframe",
                safeArea: {
                    top: () => document.querySelector('.toolbar'),
                    bottom: () => document.querySelector('.statusbar'),
                    left: () => document.querySelector('.sidebar-left'),
                    right: () => document.querySelector('.sidebar-right'),
                },
            },
            api: {
                updateCurrentLocation: function (loc) {
                    let title = loc.title || '';
                    let pos = loc.locations || {};
                    let page = pos.position != null ? pos.position : '';
                    let total = pos.totalRemainingPositions != null ? (pos.position + pos.totalRemainingPositions) : '';
                    let text = title + (page !== '' && total !== '' ? ' — ' + page + ' of ' + total : '');
                    document.getElementById('page-info').textContent = text;
                    try {
                        localStorage.setItem(positionKey, JSON.stringify(loc));
                    } catch(_) {}
                }
            }
        }).then(function (instance) { d2reader = instance; });

        function toggleScroll() {
            isScroll = !isScroll;
            d2reader.scroll(isScroll);
            let btn = document.getElementById('btn-scroll');
            btn.textContent = isScroll ? 'Scroll' : 'Paginated';
            btn.classList.toggle('active', isScroll);
        }
    </script>
</body>
</html>
